<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1Scope — Replay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/replay.css') }}">
  <script type="importmap">
    {
      "imports": {
        "three": "{{ url_for('static', filename='js/vendor/three.module.js') }}",
        "three/addons/controls/OrbitControls.js": "{{ url_for('static', filename='js/vendor/OrbitControls.js') }}",
        "chart.js": "{{ url_for('static', filename='js/vendor/chart.auto.js') }}",
        "@kurkle/color": "{{ url_for('static', filename='js/vendor/kurkle-color.esm.js') }}"
      }
    }
  </script>
</head>
<body class="replay-body">
  <div id="replay-status" class="replay-status hud-panel hud-panel--bracketed">Cargando trazado...</div>
  <div class="replay-topbar">
    <button id="settings-toggle-btn" type="button" class="settings-toggle hud-btn" aria-label="Configuración" hidden>&#9881;</button>
    <a href="/" class="replay-back hud-btn">&larr; Volver a selección</a>
  </div>
  <canvas id="replay-canvas"></canvas>

  <div id="settings-panel" class="settings-panel hud-panel hud-panel--bracketed" hidden>
    <h2 class="hud-heading hud-heading--accent">Configuración</h2>
    <label class="settings-field">
      Exageración de elevación
      <div class="settings-row">
        <input id="exaggeration-slider" type="range" min="1" max="30" step="1" value="5">
        <span id="exaggeration-value" class="settings-value">5x</span>
      </div>
      <p class="settings-hint">
        Valores altos hacen el desnivel más visible pero pueden desalinear
        los autos de la pista (ruido de los datos de elevación).
      </p>
    </label>
  </div>

  <div id="replay-controls" class="replay-controls hud-panel" hidden>
    <button id="play-pause-btn" type="button" class="hud-btn" aria-label="Pausar">⏸</button>
    <input id="scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Progreso de la sesión">
    <span id="time-display" class="time-display">00:00 / 00:00</span>
    <select id="speed-select" aria-label="Velocidad de reproducción">
      <option value="1">1x</option>
      <option value="5">5x</option>
      <option value="10">10x</option>
      <option value="20" selected>20x</option>
      <option value="50">50x</option>
      <option value="100">100x</option>
    </select>
  </div>

  <aside id="standings-panel" class="standings-panel hud-panel" hidden>
    <h2 class="hud-heading hud-heading--accent">Posiciones</h2>
    <p id="standings-status" class="standings-status"></p>
    <table class="standings-table">
      <thead>
        <tr>
          <th aria-label="Visible en 3D"></th>
          <th>Pos</th>
          <th>Piloto</th>
          <th>Gap líder</th>
          <th>Intervalo</th>
          <th>Última</th>
          <th>Mejor</th>
        </tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </aside>

  <aside id="telemetry-panel" class="telemetry-panel hud-panel" hidden>
    <h2 class="hud-heading hud-heading--accent">Telemetría comparada</h2>
    <p id="telemetry-status" class="telemetry-status"></p>
    <div class="telemetry-chart"><canvas id="chart-speed"></canvas></div>
    <div class="telemetry-chart"><canvas id="chart-throttle"></canvas></div>
    <div class="telemetry-chart"><canvas id="chart-brake"></canvas></div>
    <div class="telemetry-chart"><canvas id="chart-rpm"></canvas></div>
    <div class="telemetry-chart"><canvas id="chart-gear"></canvas></div>
  </aside>

  <script
    type="module"
    id="replay-track-script"
    src="{{ url_for('static', filename='js/replay-track.js') }}"
    data-session-key="{{ session_key }}"
  ></script>
  <script
    type="module"
    id="replay-telemetry-script"
    src="{{ url_for('static', filename='js/replay-telemetry.js') }}"
    data-session-key="{{ session_key }}"
  ></script>
  <script
    type="module"
    id="replay-standings-script"
    src="{{ url_for('static', filename='js/replay-standings.js') }}"
    data-session-key="{{ session_key }}"
  ></script>
</body>
</html>
