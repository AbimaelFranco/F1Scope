<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1Scope</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/session-select.css') }}">
</head>
<body>
  <main class="session-select">
    <h1 class="hud-heading hud-heading--accent">F1Scope</h1>
    <p class="tagline">Selecciona una carrera para analizar.</p>

    <div class="selectors">
      <label>
        Año
        <select id="year-select">
          <option value="">Selecciona un año</option>
        </select>
      </label>

      <label>
        Gran Premio
        <select id="meeting-select" disabled>
          <option value="">Selecciona un año primero</option>
        </select>
      </label>

      <label>
        Sesión
        <select id="session-select" disabled>
          <option value="">Selecciona un Gran Premio primero</option>
        </select>
      </label>
    </div>

    <section id="session-summary" class="session-summary hud-panel hud-panel--bracketed" hidden></section>

    <section id="driver-picker" class="driver-picker" hidden>
      <h2 class="hud-heading hud-heading--accent">Comparar pilotos</h2>
      <p id="driver-picker-hint" class="hint">Selecciona hasta 2 pilotos para comparar.</p>
      <div id="driver-list" class="driver-list hud-panel"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/session-select.js') }}"></script>
</body>
</html>
